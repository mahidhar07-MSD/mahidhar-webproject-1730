<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CSS Exercises</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f4f7fb;
      color: #1f2937;
      margin: 0;
      padding: 40px 20px;
    }
    .container {
      max-width: 900px;
      margin: auto;
      background: white;
      border-radius: 12px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.08);
      padding: 30px;
    }
    h1 {
      text-align: center;
      margin-bottom: 20px;
    }
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
      gap: 12px;
    }
    a {
      display: block;
      text-decoration: none;
      background: #2563eb;
      color: white;
      padding: 12px 14px;
      border-radius: 8px;
      text-align: center;
      font-weight: 600;
    }
    a:hover {
      background: #1d4ed8;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>CSS Exercises</h1>
    <div class="grid" id="css-links"></div>
  </div>

  <script>
    const cssFiles = Array.from({ length: 270 }, (_, i) => `${i + 1}.css`);
    const container = document.getElementById('css-links');

    cssFiles.forEach(file => {
      const link = document.createElement('a');
      link.href = file;
      link.textContent = file;
      container.appendChild(link);
    });
  </script>
</body>
</html>
