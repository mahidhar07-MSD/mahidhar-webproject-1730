<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CSS Selectors and Styling</title>
  <style>
    body {
      font-family: 'Georgia', serif;
      background: #f5f5dc;
      color: #222;
      margin: 30px;
    }
    h1 {
      color: #8b0000;
      text-align: center;
    }
    .note {
      background: #fff;
      border: 3px solid #008080;
      padding: 20px;
      margin: 20px 0;
    }
    #special {
      color: #006400;
      font-weight: bold;
    }
    div p {
      color: #333;
    }
    p.highlight {
      background: #ffd700;
      padding: 10px;
      border-left: 5px solid #ff6347;
    }
  </style>
</head>
<body>
  <h1>CSS Demo</h1>

  <div class="note">
    <p>This paragraph uses a class selector.</p>
    <p id="special">This paragraph uses an ID selector.</p>
  </div>

  <p class="highlight">This paragraph demonstrates colors, fonts, margins, padding, and borders.</p>

  <div>
    <p>Nested paragraph styled using a descendant selector.</p>
  </div>
</body>
</html>
