<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HTML5 Input Types</title>
</head>
<body>
  <h1>HTML5 Form Input Types</h1>
  <form>
    <label for="email">Email:</label><br>
    <input type="email" id="email" name="email" placeholder="name@example.com"><br><br>

    <label for="dob">Date:</label><br>
    <input type="date" id="dob" name="dob"><br><br>

    <label for="age">Number:</label><br>
    <input type="number" id="age" name="age" min="1" max="100"><br><br>

    <label for="password">Password:</label><br>
    <input type="password" id="password" name="password"><br><br>

    <label for="search">Search:</label><br>
    <input type="search" id="search" name="search"><br><br>

    <input type="submit" value="Submit">
  </form>
</body>
</html>
