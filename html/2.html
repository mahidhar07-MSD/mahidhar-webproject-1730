<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lists in HTML</title>
</head>
<body>
  <h1>HTML Lists</h1>

  <h2>Ordered List</h2>
  <ol>
    <li>HTML</li>
    <li>CSS</li>
    <li>JavaScript</li>
  </ol>

  <h2>Unordered List</h2>
  <ul>
    <li>Apple</li>
    <li>Banana</li>
    <li>Orange</li>
  </ul>

  <h2>Description List</h2>
  <dl>
    <dt>HTML</dt>
    <dd>HyperText Markup Language used to build web pages.</dd>
    <dt>CSS</dt>
    <dd>Cascading Style Sheets used for styling.</dd>
    <dt>JS</dt>
    <dd>JavaScript used to add interactivity.</dd>
  </dl>
</body>
</html>
