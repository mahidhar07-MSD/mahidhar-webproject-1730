<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>College Timetable</title>
  <style>
    body { font-family: Arial, sans-serif; margin: 30px; }
    table { border-collapse: collapse; width: 100%; }
    th, td { border: 1px solid #333; padding: 12px; text-align: center; }
    th { background: #0d6efd; color: white; }
  </style>
</head>
<body>
  <h1>College Timetable</h1>
  <table>
    <tr>
      <th>Time</th>
      <th>Monday</th>
      <th>Tuesday</th>
      <th>Wednesday</th>
      <th>Thursday</th>
      <th>Friday</th>
    </tr>
    <tr>
      <td>9:00 - 10:00</td>
      <td>Maths</td>
      <td>Physics</td>
      <td>DBMS</td>
      <td>Java</td>
      <td>English</td>
    </tr>
    <tr>
      <td>10:00 - 11:00</td>
      <td>Physics</td>
      <td>Maths</td>
      <td>Java</td>
      <td>DBMS</td>
      <td>Lab</td>
    </tr>
    <tr>
      <td>11:00 - 12:00</td>
      <td>Break</td>
      <td>Break</td>
      <td>Break</td>
      <td>Break</td>
      <td>Break</td>
    </tr>
    <tr>
      <td>12:00 - 1:00</td>
      <td>Web Tech</td>
      <td>English</td>
      <td>Maths</td>
      <td>Physics</td>
      <td>Project</td>
    </tr>
    <tr>
      <td>1:00 - 2:00</td>
      <td>Lunch</td>
      <td>Lunch</td>
      <td>Lunch</td>
      <td>Lunch</td>
      <td>Lunch</td>
    </tr>
  </table>
</body>
</html>
