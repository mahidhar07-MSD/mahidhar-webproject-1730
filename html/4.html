<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Images and Hyperlinks</title>
</head>
<body>
  <h1>Images and Links</h1>

  <img src="https://via.placeholder.com/350x200.png?text=Sample+Image" alt="Sample image" width="350">

  <p>
    Visit <a href="https://www.google.com" target="_blank">Google</a> for search.
  </p>

  <p>
    Learn more about HTML on the
    <a href="https://developer.mozilla.org/en-US/docs/Web/HTML" target="_blank">MDN website</a>.
  </p>

  <a href="https://www.wikipedia.org">
    <img src="https://via.placeholder.com/250x120.png?text=Wikipedia" alt="Wikipedia" width="250">
  </a>
</body>
</html>
