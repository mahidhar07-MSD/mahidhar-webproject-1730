<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Responsive Webpage</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; font-family: Arial, sans-serif; }
    .container { display: flex; gap: 20px; padding: 20px; }
    .box {
      flex: 1;
      background: #e0f7fa;
      border: 1px solid #0097a7;
      padding: 20px;
      border-radius: 10px;
    }
    @media (max-width: 700px) {
      .container { flex-direction: column; }
      body { font-size: 14px; }
    }
  </style>
</head>
<body>
  <h1>Responsive Layout</h1>
  <div class="container">
    <div class="box">
      <h2>Column 1</h2>
      <p>This section changes layout on smaller screens using media queries.</p>
    </div>
    <div class="box">
      <h2>Column 2</h2>
      <p>Responsive design improves user experience on mobile and tablet devices.</p>
    </div>
    <div class="box">
      <h2>Column 3</h2>
      <p>Media queries help adjust styles based on screen width.</p>
    </div>
  </div>
</body>
</html>
