<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HTML Table</title>
</head>
<body>
  <h1>Student Marks Table</h1>
  <table border="1" cellpadding="8" cellspacing="0">
    <tr>
      <th>Name</th>
      <th colspan="2">Subjects</th>
      <th>Total</th>
    </tr>
    <tr>
      <td rowspan="2">Asha</td>
      <td>Math</td>
      <td>85</td>
      <td>85</td>
    </tr>
    <tr>
      <td>Science</td>
      <td>90</td>
      <td>90</td>
    </tr>
    <tr>
      <td>Ravi</td>
      <td>Math</td>
      <td>78</td>
      <td>78</td>
    </tr>
    <tr>
      <td colspan="4" align="center"><b>End of Records</b></td>
    </tr>
  </table>
</body>
</html>
