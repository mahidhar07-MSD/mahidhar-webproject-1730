<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HTML Table with Merged Cells</title>
</head>
<body>
  <h1>Student Information Table</h1>
  <table border="1" cellpadding="10" cellspacing="0">
    <tr>
      <th>Name</th>
      <th>Subject</th>
      <th colspan="2">Marks</th>
    </tr>
    <tr>
      <td rowspan="2">Aisha</td>
      <td>Math</td>
      <td>90</td>
      <td>Pass</td>
    </tr>
    <tr>
      <td>Science</td>
      <td>85</td>
      <td>Pass</td>
    </tr>
    <tr>
      <td>Rahul</td>
      <td>English</td>
      <td colspan="2">88</td>
    </tr>
  </table>
</body>
</html>
