<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Iframe Example</title>
  <style>
    body { font-family: Arial, sans-serif; margin: 20px; }
    .container { display: flex; gap: 20px; }
    .content { flex: 1; }
    iframe { width: 50%; min-height: 320px; border: 2px solid #333; }
  </style>
</head>
<body>
  <h1>Webpage Using iframe</h1>

  <div class="container">
    <div class="content">
      <h2>About the Project</h2>
      <p>This page shows an iframe embedded inside another webpage.</p>
      <p>Frames are useful for displaying external content or another HTML page within the main page.</p>
    </div>

    <iframe src="7-frame-content.html" title="Nested content example"></iframe>
  </div>
</body>
</html>
